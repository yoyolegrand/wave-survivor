name: Build

# Vérifie que le mod compile à chaque push et chaque demande de fusion, et que le titre de version tiendra dans Modrinth (≤ 64 caractères).
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check release title length
        run: python3 .github/scripts/check_title.py

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
